<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flota 5 Estrellas</title>
    
    <!-- Íconos para la pantalla de inicio del celular y pestaña del navegador -->
    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #ffffff; 
            color: #333;
        }
        .header-logo {
            text-align: center;
            margin-bottom: 15px;
        }
        h1, h2, h3 { text-align: center; color: #cc0000; } 
        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #cc0000; 
            box-shadow: 0 4px 6px rgba(204,0,0,0.15);
        }
        input, button, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #cc0000; 
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="file"] {
            background-color: #f9f9f9;
            cursor: pointer;
        }
        button {
            background-color: #cc0000; 
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #990000; }
        button:disabled { background-color: #ff9999; cursor: not-allowed; }
        
        .btn-dueno { background-color: #cc0000; }
        .btn-chofer { background-color: #ffffff; color: #cc0000; border: 2px solid #cc0000; }
        .btn-chofer:hover { background-color: #ffe6e6; }
        
        .vehicle-card, .maintenance-card, .report-card {
            background: #ffffff;
            border: 1px solid #e6e6e6;
            border-left: 5px solid #cc0000; 
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        
        .history-card {
            border-left: 5px solid #777; 
        }

        .delete-btn { background-color: #555; margin-top: 5px; } 
        .delete-btn:hover { background-color: #333; }
        .manage-btn { background-color: #cc0000; margin-top: 5px;}
        .back-btn { background-color: #777; color: white; border: none; }
        
        .section { display: none; }
        .active { display: block; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- LOGO DE LA AGENCIA -->
    <div class="header-logo">
        <svg viewBox="0 0 100 100" width="90" height="90" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,5 61,39 98,39 68,59 79,95 50,75 21,95 32,59 2,39 39,39" fill="#cc0000" stroke="#cc0000" stroke-width="2"/>
            <text x="50" y="68" font-size="42" font-family="Arial" font-weight="bold" fill="white" text-anchor="middle">5</text>
        </svg>
    </div>
    
    <h1>Flota 5 Estrellas</h1>
    
    <!-- PANTALLA PRINCIPAL: LOGIN -->
    <div id="login-section" class="section active">
        <h2>Ingreso al Sistema</h2>
        <button class="btn-dueno" onclick="window.showDuenoLogin()">Ingresar como Dueño</button>
        <button class="btn-chofer" onclick="window.showChoferLogin()">Ingresar como Chofer</button>
    </div>

    <!-- PANTALLA LOGIN DUEÑO -->
    <div id="dueno-login-section" class="section">
        <h2>Acceso Administrativo</h2>
        <input type="password" id="admin-pass" placeholder="Contraseña">
        <button class="btn-dueno" onclick="window.loginDueno()">Entrar</button>
        <button class="back-btn" onclick="window.showSection('login-section')">Volver</button>
    </div>

    <!-- PANTALLA DUEÑO: PANEL PRINCIPAL -->
    <div id="dueno-panel-section" class="section">
        <button class="back-btn" onclick="window.showSection('login-section')">⬅ Cerrar Sesión</button>
        <h2>Panel de Control</h2>
        
        <h3>Novedades de Choferes</h3>
        <div id="reports-list">Cargando reportes...</div>

        <h3>Agregar Vehículo a la Flota</h3>
        <input type="text" id="veh-name" placeholder="Vehículo (ej. Gol 1.6, Berlingo)">
        <input type="text" id="veh-patente" placeholder="Patente">
        <button onclick="window.addVehicle()">Guardar Vehículo</button>

        <h3>Mi Flota</h3>
        <div id="vehicles-list">Cargando vehículos...</div>
    </div>

    <!-- PANTALLA DUEÑO: MANTENIMIENTO E HISTORIAL -->
    <div id="maintenance-section" class="section">
        <button class="back-btn" onclick="window.showSection('dueno-panel-section')">⬅ Volver al Panel</button>
        <h2 id="current-vehicle-title">Mantenimiento</h2>
        
        <h3>Anotar Tarea Pendiente</h3>
        <input type="text" id="maint-desc" placeholder="Ej. Cambio de Aceite, Frenos">
        
        <!-- CAMPOS DE KILOMETRAJE -->
        <input type="number" id="maint-km-actual" placeholder="Kilometraje en que se hizo (Ej: 120000)">
        <input type="number" id="maint-km" placeholder="Próximo cambio a los (Ej: 130000)">
        
        <label style="font-size: 14px; color: #666;">Fecha límite (Opcional):</label>
        <input type="date" id="maint-date">
        <button onclick="window.addMaintenance()">Guardar Tarea</button>

        <h3>Tareas Pendientes</h3>
        <div id="maintenance-list"></div>

        <hr style="border: 1px solid #eee; margin: 30px 0;">

        <h3>Historial de Reportes Resueltos</h3>
        <div id="historial-list"></div>
    </div>

    <!-- PANTALLA CHOFER: REPORTE -->
    <div id="chofer-section" class="section">
        <button class="back-btn" onclick="window.showSection('login-section')">⬅ Volver</button>
        <h2>Reporte de Novedades</h2>
        <input type="text" id="chofer-nombre" placeholder="Tu Nombre">
        <select id="chofer-vehiculo">
            <option value="">Seleccioná el vehículo que manejás...</option>
        </select>
        <textarea id="chofer-novedad" rows="4" placeholder="Ej: Se quemó la luz de giro derecha, ruido en el tren delantero..."></textarea>
        
        <label style="font-size: 14px; color: #666; font-weight: bold;">Adjuntar foto de la novedad (Opcional):</label>
        <input type="file" id="chofer-foto" accept="image/*">
        
        <button id="btn-enviar-reporte" class="btn-dueno" onclick="window.enviarReporte()">Enviar Reporte al Dueño</button>
    </div>

</div>

<!-- CONEXIÓN CON FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDPryrds2qJSp6FKu3FDSZgswXB-Ur9Zq8",
      authDomain: "flota-5-estrellas.firebaseapp.com",
      databaseURL: "https://flota-5-estrellas-default-rtdb.firebaseio.com",
      projectId: "flota-5-estrellas",
      messagingSenderId: "784109809805",
      appId: "1:784109809805:web:33eb3d1de88c9fdf5272c4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentVehicleId = null;
    let vehiculosGlobal = [];

    window.showSection = function(sectionId) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
    };

    window.showDuenoLogin = function() { window.showSection('dueno-login-section'); };
    window.showChoferLogin = function() { 
        window.showSection('chofer-section'); 
        actualizarSelectChofer();
    };

    window.loginDueno = function() {
        const pass = document.getElementById('admin-pass').value;
        if(pass === "5estrellas") { 
            document.getElementById('admin-pass').value = '';
            window.showSection('dueno-panel-section');
        } else {
            alert("Contraseña incorrecta");
        }
    };

    // --- GESTIÓN DE VEHÍCULOS ---
    window.addVehicle = function() {
        const name = document.getElementById('veh-name').value;
        const patente = document.getElementById('veh-patente').value;
        if (!name || !patente) return alert('Completá nombre y patente.');
        
        const vehRef = push(ref(db, 'vehiculos'));
        set(vehRef, { name: name, patente: patente });
        
        document.getElementById('veh-name').value = '';
        document.getElementById('veh-patente').value = '';
    };

    window.eliminarVehiculo = function(id) {
        if(confirm("¿Borrar vehículo y todo su historial de mantenimiento?")) {
            remove(ref(db, 'vehiculos/' + id));
        }
    };

    window.gestionarMantenimiento = function(id, name) {
        currentVehicleId = id;
        document.getElementById('current-vehicle-title').innerText = "Ficha de: " + name;
        window.showSection('maintenance-section');
        
        // Cargar tareas pendientes
        onValue(ref(db, 'vehiculos/' + id + '/mantenimiento'), (snapshot) => {
            const list = document.getElementById('maintenance-list');
            list.innerHTML = '';
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const m = childSnapshot.val();
                    list.innerHTML += `
                        <div class="maintenance-card">
                            <h4 style="margin-top:0; color:#cc0000;">${m.desc}</h4>
                            <p style="margin:5px 0;"><strong>Hecho a los:</strong> ${m.kmActual ? m.kmActual + ' km' : 'No anotado'}</p>
                            <p style="margin:5px 0;"><strong>Próximo cambio a los:</strong> ${m.km ? m.km + ' km' : 'No anotado'}</p>
                            <p style="margin:5px 0;"><strong>Fecha límite:</strong> ${m.date ? m.date : 'Sin fecha'}</p>
                            <button class="delete-btn" onclick="window.borrarMantenimiento('${id}', '${childSnapshot.key}')">Eliminar Tarea</button>
                        </div>
                    `;
                });
            } else {
                list.innerHTML = '<p style="color:#777;">No hay tareas pendientes.</p>';
            }
        });

        // Cargar historial de reportes resueltos
        onValue(ref(db, 'vehiculos/' + id + '/historial'), (snapshot) => {
            const list = document.getElementById('historial-list');
            list.innerHTML = '';
            if (snapshot.exists()) {
                let historialHTML = '';
                snapshot.forEach((childSnapshot) => {
                    const h = childSnapshot.val();
                    const fotoLink = h.fotoUrl ? `<a href="${h.fotoUrl}" target="_blank" style="color: #cc0000; font-weight: bold; display: inline-block; margin-top: 5px;">📷 Ver foto adjunta</a>` : '';
                    historialHTML = `
                        <div class="maintenance-card history-card">
                            <p style="margin:5px 0; font-size: 14px; color: #555;">📅 ${h.fecha}</p>
                            <p style="margin:5px 0;"><strong>Reportó:</strong> ${h.nombre}</p>
                            <p style="margin:5px 0;"><strong>Novedad solucionada:</strong> ${h.novedad}</p>
                            ${fotoLink}
                        </div>
                    ` + historialHTML;
                });
                list.innerHTML = historialHTML;
            } else {
                list.innerHTML = '<p style="color:#777;">No hay reportes previos en este vehículo.</p>';
            }
        });
    };

    window.addMaintenance = function() {
        const desc = document.getElementById('maint-desc').value;
        const kmActual = document.getElementById('maint-km-actual').value;
        const km = document.getElementById('maint-km').value;
        const date = document.getElementById('maint-date').value;
        
        if (!desc) return alert('La descripción es obligatoria.');

        const maintRef = push(ref(db, 'vehiculos/' + currentVehicleId + '/mantenimiento'));
        set(maintRef, { desc, kmActual, km, date });

        document.getElementById('maint-desc').value = '';
        document.getElementById('maint-km-actual').value = '';
        document.getElementById('maint-km').value = '';
        document.getElementById('maint-date').value = '';
    };

    window.borrarMantenimiento = function(vehId, maintId) {
        if(confirm('¿Borrar tarea?')) {
            remove(ref(db, 'vehiculos/' + vehId + '/mantenimiento/' + maintId));
        }
    };

    // --- FUNCIONES DEL CHOFER ---
    function actualizarSelectChofer() {
        const select = document.getElementById('chofer-vehiculo');
        select.innerHTML = '<option value="">Seleccioná el vehículo...</option>';
        vehiculosGlobal.forEach(v => {
            select.innerHTML += `<option value="${v.id}">${v.name} - ${v.patente}</option>`;
        });
    }

    // NUEVA FUNCIÓN: Comprime la imagen antes de subirla
    function comprimirImagen(archivo) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(archivo);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const max_width = 800;
                    const max_height = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > max_width) {
                            height = Math.round(height *= max_width / width);
                            width = max_width;
                        }
                    } else {
                        if (height > max_height) {
                            width = Math.round(width *= max_height / height);
                            height = max_height;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Comprime a JPEG con 70% de calidad
                    canvas.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/jpeg', 0.7);
                };
                img.onerror = error => reject(error);
            };
            reader.onerror = error => reject(error);
        });
    }

    window.enviarReporte = async function() {
        const nombre = document.getElementById('chofer-nombre').value;
        const selectVehiculo = document.getElementById('chofer-vehiculo');
        const vehId = selectVehiculo.value; 
        const novedad = document.getElementById('chofer-novedad').value;
        const fotoInput = document.getElementById('chofer-foto');
        
        if(!nombre || !vehId || !novedad) return alert("Por favor completá todos los datos para avisarle al dueño.");

        const vehName = selectVehiculo.options[selectVehiculo.selectedIndex].text; 
        const fecha = new Date().toLocaleString();
        let fotoUrl = "";

        const btnEnviar = document.getElementById('btn-enviar-reporte');
        const btnTextoOriginal = btnEnviar.innerText;
        btnEnviar.innerText = "Comprimiendo y Enviando...";
        btnEnviar.disabled = true;

        try {
            // Si hay foto, la comprimimos y la mandamos a ImgBB
            if (fotoInput.files.length > 0) {
                const archivo = fotoInput.files[0];
                
                // Llamamos a la función para comprimir
                const blobComprimido = await comprimirImagen(archivo);

                const formData = new FormData();
                // Pasamos el blob y le asignamos un nombre de archivo
                formData.append("image", blobComprimido, "reporte.jpg");
                
                const apiKey = "ed0673fde30f371ec0e5de88dcfa3f0e"; 
                const urlImgbb = `https://api.imgbb.com/1/upload?key=${apiKey}`;
                
                const response = await fetch(urlImgbb, {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                
                if(data.success) {
                    fotoUrl = data.data.url;
                } else {
                    alert("No se pudo adjuntar la foto, pero se enviará el texto.");
                }
            }

            // Guardamos los datos en Firebase
            const reportRef = push(ref(db, 'reportes'));
            await set(reportRef, { nombre, vehId, vehiculo: vehName, novedad, fecha, fotoUrl });
            
            alert("¡Novedad enviada exitosamente!");
            
            // Limpiar formulario y volver
            document.getElementById('chofer-novedad').value = '';
            document.getElementById('chofer-foto').value = '';
            window.showSection('login-section');

        } catch (error) {
            console.error("Error subiendo el reporte:", error);
            alert("Hubo un error al enviar el reporte. Por favor, intentá de nuevo.");
        } finally {
            btnEnviar.innerText = btnTextoOriginal;
            btnEnviar.disabled = false;
        }
    };

    // --- SISTEMA DE ARCHIVADO ---
    window.resolverReporte = function(reportId) {
        if(confirm("¿Marcar este reporte como resuelto y guardarlo en el historial del vehículo?")) {
            const reportRef = ref(db, 'reportes/' + reportId);
            
            get(reportRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const r = snapshot.val();
                    
                    if(r.vehId) {
                        const histRef = push(ref(db, 'vehiculos/' + r.vehId + '/historial'));
                        set(histRef, { 
                            nombre: r.nombre, 
                            fecha: r.fecha, 
                            novedad: r.novedad,
                            fotoUrl: r.fotoUrl || "" 
                        }).then(() => {
                            remove(reportRef);
                        });
                    } else {
                        remove(reportRef);
                    }
                }
            });
        }
    };

    // --- ESCUCHADORES EN TIEMPO REAL ---
    onValue(ref(db, 'vehiculos'), (snapshot) => {
        const list = document.getElementById('vehicles-list');
        list.innerHTML = '';
        vehiculosGlobal = [];
        if (snapshot.exists()) {
            snapshot.forEach((childSnapshot) => {
                const id = childSnapshot.key;
                const v = childSnapshot.val();
                vehiculosGlobal.push({id, ...v});
                list.innerHTML += `
                    <div class="vehicle-card">
                        <h3 style="margin-top:0;">${v.name}</h3>
                        <p style="margin:5px 0;"><strong>Patente:</strong> ${v.patente}</p>
                        <button class="manage-btn" onclick="window.gestionarMantenimiento('${id}', '${v.name}')">Ficha e Historial</button>
                        <button class="delete-btn" onclick="window.eliminarVehiculo('${id}')">Eliminar Auto</button>
                    </div>
                `;
            });
        } else {
            list.innerHTML = '<p>No hay vehículos registrados.</p>';
        }
        if(document.getElementById('chofer-section').classList.contains('active')) {
            actualizarSelectChofer();
        }
    });

    onValue(ref(db, 'reportes'), (snapshot) => {
        const list = document.getElementById('reports-list');
        list.innerHTML = '';
        if (snapshot.exists()) {
            let reportesHTML = '';
            snapshot.forEach((childSnapshot) => {
                const r = childSnapshot.val();
                
                // Mostrar imagen si existe
                let imgTag = r.fotoUrl ? `<img src="${r.fotoUrl}" style="max-width: 100%; border-radius: 5px; margin-top: 10px;" alt="Foto del reporte">` : '';

                reportesHTML = `
                    <div class="report-card">
                        <strong style="color: #cc0000;">🚨 Alerta de ${r.nombre}</strong>
                        <p style="margin: 5px 0; font-size: 14px; color: #555;">${r.fecha}</p>
                        <p style="margin: 5px 0;"><strong>Auto:</strong> ${r.vehiculo}</p>
                        <p style="margin: 5px 0;"><strong>Novedad:</strong> ${r.novedad}</p>
                        ${imgTag}
                        <div style="margin-top: 10px;">
                            <button class="manage-btn" onclick="window.resolverReporte('${childSnapshot.key}')">Marcar Resuelto</button>
                        </div>
                    </div>
                ` + reportesHTML; 
            });
            list.innerHTML = reportesHTML;
        } else {
            list.innerHTML = '<p style="color: #555;">✅ No hay novedades de los choferes pendientes.</p>';
        }
    });
</script>

</body>
</html>
